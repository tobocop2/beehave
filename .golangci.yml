version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - errorlint
    - gosec
    - misspell
    - nakedret
    - gocritic
    - goconst
    - mnd
    - cyclop
    - gocognit
    - funlen
    - nestif
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - forbidigo
    - depguard
    - sloglint
    - noctx
    - contextcheck
    - ireturn
    - interfacebloat
    - nolintlint
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - perfsprint
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    funlen:
      lines: 20
      statements: 15
      ignore-comments: true
    nestif:
      min-complexity: 4
    goconst:
      min-len: 3
      min-occurrences: 3
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      no-global: all
      context: scope
    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: package-comments
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read the environment in internal/config only
        - pattern: ^fmt\.(Print|Printf|Println)$
          msg: write to an io.Writer; fmt.Print is for internal/cli only
        - pattern: ^reflect\.
          msg: do not reflect on owned types
        - pattern: ^slog\.(Default|SetDefault)$
          msg: pass a *slog.Logger in
        - pattern: ^os\.Exit$
          msg: return an error; os.Exit is for cmd/beehave and internal/cli only
        - pattern: ^panic$
          msg: return an error; panic is for cmd/beehave and internal/cli only
        - pattern: ^os\.(Stdout|Stderr)$
          msg: write to an io.Writer you receive; os.Stdout and os.Stderr are for cmd/beehave and internal/cli only
    depguard:
      rules:
        no-testify-in-production:
          files: ["!$test"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: testify is for tests only
        no-dbos-enterprise:
          files: ["$all"]
          deny:
            - pkg: go.dbos.dev/dbos-enterprise-go
              desc: the enterprise module opens an outgoing connection; never import it
        no-http-client:
          files: ["!$test", "!**/internal/sandbox/proxy.go"]
          deny:
            - pkg: net/http
              desc: beehave's own code makes no HTTP calls; gh, bd and the agent CLIs do the network calls
        no-shell-interpreter:
          files: ["$all"]
          deny:
            - pkg: mvdan.cc/sh/v3/interp
              desc: beehave parses shell text and never runs it
        test-packages-in-tests-only:
          files: ["!$test", "!**/internal/host/slurmtest/**", "!**/internal/host/sshtest/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/agent/agenttest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/forge/forgetest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/store/storetest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/store/beads/beadstest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/proc/proctest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/host/hosttest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/host/slurmtest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/host/sshtest
              desc: a conformance suite or fake is for tests only
            - pkg: github.com/tobocop2/beehave/internal/sandbox/contract
              desc: a conformance suite or fake is for tests only
        dbos-only-in-flow:
          files: ["!**/internal/flow/**"]
          deny:
            - pkg: github.com/dbos-inc/dbos-transact-golang
              desc: only internal/flow imports DBOS
        engine-never-imports-examples:
          files: ["**/internal/**", "**/cmd/beehave/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/examples
              desc: the engine never imports the examples, and the rule has no exception
        remedy-binary-takes-the-forge-and-the-claim-rows-only:
          files: ["**/examples/remediation/tools/cmd/remedy/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: the remedy binary imports the forge backend and the claim rows, and no other backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: the remedy binary imports the forge backend and the claim rows, and no other backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: the remedy binary imports the forge backend and the claim rows, and no other backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: the remedy binary imports the forge backend and the claim rows, and no other backend
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: the remedy binary imports the forge backend and the claim rows, and no other backend
        # The skypilot adapter queues its jobs through the slurm adapter, so it is the one backend that imports another. no-backend-to-backend-host-skypilot
        # keeps it from importing any other backend. The three host adapters (ssh, slurm, skypilot) never import each other otherwise: a blank-import probe in
        # each of ssh, slurm, skypilot and flow shows a denial. The slurm to skypilot import is a Go import cycle, so the compiler also refuses it.
        backends-only-in-main:
          files: ["!$test", "!**/cmd/beehave/**", "!**/examples/remediation/tools/cmd/remedy/**", "!**/internal/host/skypilot/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: only cmd/beehave and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/store/local
              desc: only cmd/beehave and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: only cmd/beehave and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: only cmd/beehave and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: only cmd/beehave and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: only cmd/beehave and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: only cmd/beehave, the skypilot adapter and the remedy binary import a backend
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: only cmd/beehave and the remedy binary import a backend
        # depguard reports only the first list that matches a file. A backend that imports another backend is reported by backends-only-in-main
        # when that list comes first, so the no-backend-to-backend lists below enforce the same denial and are never the one that reports.
        no-backend-to-backend-store-beads:
          files: ["**/internal/store/beads/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: a backend never imports another backend
        no-backend-to-backend-store-github:
          files: ["**/internal/store/github/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: a backend never imports another backend
        no-backend-to-backend-forge-github:
          files: ["**/internal/forge/github/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: a backend never imports another backend
        no-backend-to-backend-host-skypilot:
          files: ["**/internal/host/skypilot/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/local
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: a backend never imports another backend
        no-backend-to-backend-host-slurm:
          files: ["**/internal/host/slurm/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/local
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: a backend never imports another backend
        no-backend-to-backend-host-ssh:
          files: ["**/internal/host/ssh/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/store/local
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/agent/claude
              desc: a backend never imports another backend
        no-backend-to-backend-agent-claude:
          files: ["**/internal/agent/claude/**"]
          deny:
            - pkg: github.com/tobocop2/beehave/internal/host/ssh
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/skypilot
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/host/slurm
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/beads
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/store/github
              desc: a backend never imports another backend
            - pkg: github.com/tobocop2/beehave/internal/forge/github
              desc: a backend never imports another backend
        layer-0:
          list-mode: lax
          files:
            - "**/internal/model/**"
            - "**/internal/config/**"
            - "**/internal/lockfile/**"
            - "**/internal/atomicfile/**"
            - "**/internal/exectest/**"
          deny:
            - pkg: github.com/tobocop2/beehave/internal
              desc: a package imports its own layer and lower layers only (docs/architecture.md)
          allow:
            - github.com/tobocop2/beehave/internal/model
            - github.com/tobocop2/beehave/internal/config
            - github.com/tobocop2/beehave/internal/lockfile
            - github.com/tobocop2/beehave/internal/atomicfile
            - github.com/tobocop2/beehave/internal/exectest
        layer-1:
          list-mode: lax
          files:
            - "**/internal/store/**"
            - "**/internal/forge/**"
            - "**/internal/proc/**"
            - "**/internal/agent/**"
            - "**/internal/host/**"
            - "**/internal/sandbox/**"
          deny:
            - pkg: github.com/tobocop2/beehave/internal
              desc: a package imports its own layer and lower layers only (docs/architecture.md)
          allow:
            - github.com/tobocop2/beehave/internal/model
            - github.com/tobocop2/beehave/internal/config
            - github.com/tobocop2/beehave/internal/exectest
            - github.com/tobocop2/beehave/internal/store
            - github.com/tobocop2/beehave/internal/forge
            - github.com/tobocop2/beehave/internal/proc
            - github.com/tobocop2/beehave/internal/agent
            - github.com/tobocop2/beehave/internal/host
            - github.com/tobocop2/beehave/internal/sandbox
        layer-2:
          list-mode: lax
          files:
            - "**/internal/check/shell/**"
            - "**/internal/batch/**"
            - "**/internal/claim/**"
            - "**/internal/gate/**"
            - "**/internal/lease/**"
            - "**/internal/merge/**"
            - "**/internal/review/**"
            - "**/internal/pool/**"
            - "**/internal/preflight/**"
            - "**/internal/workflow/**"
          deny:
            - pkg: github.com/tobocop2/beehave/internal
              desc: a package imports its own layer and lower layers only (docs/architecture.md)
          allow:
            - github.com/tobocop2/beehave/internal/model
            - github.com/tobocop2/beehave/internal/config
            - github.com/tobocop2/beehave/internal/lockfile
            - github.com/tobocop2/beehave/internal/atomicfile
            - github.com/tobocop2/beehave/internal/exectest
            - github.com/tobocop2/beehave/internal/check/shell
            - github.com/tobocop2/beehave/internal/batch
            - github.com/tobocop2/beehave/internal/claim
            - github.com/tobocop2/beehave/internal/gate
            - github.com/tobocop2/beehave/internal/lease
            - github.com/tobocop2/beehave/internal/merge
            - github.com/tobocop2/beehave/internal/review
            - github.com/tobocop2/beehave/internal/pool
            - github.com/tobocop2/beehave/internal/preflight
            - github.com/tobocop2/beehave/internal/workflow
        layer-3:
          list-mode: lax
          files:
            - "**/internal/flow/**"
          deny:
            - pkg: github.com/tobocop2/beehave/internal
              desc: a package imports its own layer and lower layers only (docs/architecture.md)
          allow:
            - github.com/tobocop2/beehave/internal/model
            - github.com/tobocop2/beehave/internal/config
            - github.com/tobocop2/beehave/internal/lockfile
            - github.com/tobocop2/beehave/internal/atomicfile
            - github.com/tobocop2/beehave/internal/exectest
            - github.com/tobocop2/beehave/internal/store
            - github.com/tobocop2/beehave/internal/forge
            - github.com/tobocop2/beehave/internal/proc
            - github.com/tobocop2/beehave/internal/agent
            - github.com/tobocop2/beehave/internal/host
            - github.com/tobocop2/beehave/internal/claim
            - github.com/tobocop2/beehave/internal/gate
            - github.com/tobocop2/beehave/internal/batch
            - github.com/tobocop2/beehave/internal/merge
            - github.com/tobocop2/beehave/internal/review
            - github.com/tobocop2/beehave/internal/pool
            - github.com/tobocop2/beehave/internal/preflight
            - github.com/tobocop2/beehave/internal/workflow
            - github.com/tobocop2/beehave/internal/flow
        unlisted-package:
          list-mode: lax
          files:
            - "!**/cmd/beehave/**"
            - "!**/examples/**"
            - "!**/internal/model/**"
            - "!**/internal/config/**"
            - "!**/internal/lockfile/**"
            - "!**/internal/atomicfile/**"
            - "!**/internal/exectest/**"
            - "!**/internal/store/**"
            - "!**/internal/forge/**"
            - "!**/internal/proc/**"
            - "!**/internal/agent/**"
            - "!**/internal/host/**"
            - "!**/internal/sandbox/**"
            - "!**/internal/check/**"
            - "!**/internal/batch/**"
            - "!**/internal/claim/**"
            - "!**/internal/gate/**"
            - "!**/internal/lease/**"
            - "!**/internal/merge/**"
            - "!**/internal/review/**"
            - "!**/internal/pool/**"
            - "!**/internal/preflight/**"
            - "!**/internal/workflow/**"
            - "!**/internal/flow/**"
            - "!**/internal/cli/**"
            - "!**/internal/tui/**"
          deny:
            - pkg: github.com/tobocop2/beehave/internal
              desc: add this package to a layer in .golangci.yml before it imports internal code
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: internal/config/
        linters:
          - forbidigo
        text: os\.(Getenv|LookupEnv|Environ)
      - path: (internal/cli/|cmd/beehave/|examples/remediation/tools/cmd/remedy/)
        linters:
          - forbidigo
        text: fmt\.|os\.Exit|os\.Std|panic
      - path: internal/sandbox/(landlock/contract|contract/run)_linux_test\.go
        linters:
          - forbidigo
        text: os\.Exit|os\.Std
      - path: (_test\.go|internal/host/slurmtest/|internal/host/sshtest/)
        linters:
          - funlen
          - mnd
          - goconst
          - gochecknoglobals
          - ireturn

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tobocop2/beehave
