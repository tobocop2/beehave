<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 655 255" width="655" height="255" role="img" aria-label="beehest">
  <style>
    .bleed { transform-box: fill-box; transform-origin: 50% 0%; fill: #b4637a; }
    @keyframes drip0 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(0.4px) scaleY(1.000); } }
    .r0 { animation: drip0 3.6s ease-in-out 0.00s infinite; }
    @keyframes drip1 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(0.7px) scaleY(1.013); } }
    .r1 { animation: drip1 3.6s ease-in-out 0.11s infinite; }
    @keyframes drip2 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(1.0px) scaleY(1.027); } }
    .r2 { animation: drip2 3.6s ease-in-out 0.22s infinite; }
    @keyframes drip3 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(1.3px) scaleY(1.040); } }
    .r3 { animation: drip3 3.6s ease-in-out 0.33s infinite; }
    @keyframes drip4 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(1.6px) scaleY(1.053); } }
    .r4 { animation: drip4 3.6s ease-in-out 0.44s infinite; }
    @keyframes drip5 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(1.8px) scaleY(1.067); } }
    .r5 { animation: drip5 3.6s ease-in-out 0.55s infinite; }
    @keyframes drip6 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(2.1px) scaleY(1.080); } }
    .r6 { animation: drip6 3.6s ease-in-out 0.66s infinite; }
    @keyframes drip7 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(2.4px) scaleY(1.093); } }
    .r7 { animation: drip7 3.6s ease-in-out 0.77s infinite; }
    @keyframes drip8 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(2.7px) scaleY(1.107); } }
    .r8 { animation: drip8 3.6s ease-in-out 0.88s infinite; }
    @keyframes drip9 { 0%, 60%, 100% { fill: #b4637a; transform: translateY(0) scaleY(1); } 22% { fill: #5e1330; transform: translateY(3.0px) scaleY(1.120); } }
    .r9 { animation: drip9 3.6s ease-in-out 0.99s infinite; }
    .drop { transform-box: fill-box; transform-origin: 50% 0%; fill: #5e1330; opacity: 0; }
    @keyframes fall {
      0%   { opacity: 0; transform: translateY(-4px) scaleY(.3); }
      12%  { opacity: 1; transform: translateY(-2px) scaleY(.8); }
      38%  { opacity: 1; transform: translateY(2px) scaleY(1.6); animation-timing-function: cubic-bezier(.5,0,1,1); }
      78%  { opacity: .85; transform: translateY(46px) scaleY(1.1); }
      86%, 100% { opacity: 0; transform: translateY(52px) scaleY(.6); }
    }
    .d0 { animation: fall 3.38s ease-in 0.47s infinite; }
    .d1 { animation: fall 3.59s ease-in 0.42s infinite; }
    .d2 { animation: fall 4.31s ease-in 2.60s infinite; }
    .d3 { animation: fall 3.64s ease-in 1.71s infinite; }
    .d4 { animation: fall 2.68s ease-in 3.46s infinite; }
    .d5 { animation: fall 3.35s ease-in 2.25s infinite; }
    .d6 { animation: fall 3.61s ease-in 2.79s infinite; }
    .d7 { animation: fall 3.65s ease-in 2.63s infinite; }
    .d8 { animation: fall 2.78s ease-in 2.91s infinite; }
    .d9 { animation: fall 3.71s ease-in 2.09s infinite; }
    .d10 { animation: fall 4.00s ease-in 1.97s infinite; }
    .d11 { animation: fall 3.25s ease-in 1.14s infinite; }
    .d12 { animation: fall 3.86s ease-in 1.13s infinite; }
    .d13 { animation: fall 3.55s ease-in 3.53s infinite; }
    @media (prefers-reduced-motion: reduce) { .bleed, .drop { animation: none; } }
  </style>
