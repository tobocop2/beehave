  <style>
    .bee   { transform-box: fill-box; transform-origin: 50% 60%; animation: hover 2.6s ease-in-out infinite; }
    .wings { transform-box: fill-box; transform-origin: 20% 100%; animation: flutter .16s ease-in-out infinite; }
    @keyframes hover   { 0%, 100% { transform: translate(0, 0) rotate(0deg); }
                         50%      { transform: translate(-3px, -6px) rotate(-2deg); } }
    @keyframes flutter { 0%, 100% { transform: scaleY(1); opacity: 1; }
                         50%      { transform: scaleY(.72); opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .bee, .wings { animation: none; } }
