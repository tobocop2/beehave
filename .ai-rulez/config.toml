version = '5.0'
name = 'obee'
description = 'Go tool that takes a backlog of issues to reviewed, gated pull requests with any coding agent'
gitignore = true
presets = ["claude", "codex", "opencode"]
# obee ships no generic or personal skills: every builtin domain is off, so the
# generated agent files carry only the rules in this folder.
builtins = [
  '!ai-governance',
  '!agent-delegation',
  '!code-quality',
  '!git-workflow',
  '!security',
  '!testing',
  '!token-efficiency',
]

compact = true

[header]
style = 'minimal'

[defaults]
effort = 'medium'
