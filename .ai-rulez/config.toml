version = '5.0'
name = 'beehave'
description = 'Go tool that takes a backlog of issues to reviewed, gated pull requests with any coding agent'
gitignore = true
presets = ["claude", "codex", "opencode"]
# beehave ships no generic or personal skills: every builtin domain is off, so the
# generated agent files carry only the rules in this folder.
builtins = [
  '!ai-governance',
  '!agent-delegation',
  '!code-quality',
  '!git-workflow',
  '!security',
  '!testing',
  '!token-efficiency',
]

compact = true

[header]
style = 'minimal'

[defaults]
effort = 'medium'

# Claude Code names a plugin skill with the plugin first (/beehave:run,
# /beehave:status), so these skills do not replace the built-in commands.
[lint]
allow_overrides = ['claude:run', 'claude:status']
