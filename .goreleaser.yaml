version: 2

project_name: beehave

before:
  hooks:
    - go mod verify

builds:
  - id: beehave
    main: ./cmd/beehave
    binary: beehave
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: beehave
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

# The binary is not signed, so the cask removes its quarantine attribute.
homebrew_casks:
  - name: beehave
    repository:
      owner: tobocop2
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:tobocop2/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    binaries:
      - beehave
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/beehave"]
          end
