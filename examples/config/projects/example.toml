# One project profile. Make one file for each project.
# The keys of a project. An unknown key is refused. build_host is optional; the default is local.
# tracker and forge name the adapters of the project. No adapter is a default.
# Name this file in `obee run --project <name>`. The gate step runs `gate` for that project.

repo = "your-org/your-repo"
tracker = "github"         # "beads" or "github" (GitHub Issues); this chooses where work items live
forge = "github"           # "github"
beads_prefix = "proj"      # the id prefix of the beads database. The claim leases live in beads for every tracker.
base_branch = "main"
gate = "make check"        # the same command that your CI runs
build_host = "local"       # "local", or the name of a SkyPilot cluster (not a Slurm partition)

# [steps.<name>] changes one step of the workflow for this project. All keys are optional.
# Steps: claim, claim-gate, plan, implement, gate, round, review, record, owner-wait, ready,
# integrate, release.
# plan, implement and review start an agent: they take runner (a name from runners.toml), skills
# (the skills the step must call) and idle_timeout (the longest silence before the step stops).
# The other steps run a command: they take timeout. owner-wait takes none; it waits for the owner.
# Durations are written like "30m" or "1h30m".
# [steps.gate]
# timeout = "2h"           # a slow project raises the gate limit
# [steps.implement]
# runner = "claude-a"
# skills = ["test-driven-development"]
# idle_timeout = "45m"
# fresh_runner = "claude-b"  # implement only: the runner of the fresh agent in fix round 4 (default: the same runner)
