name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      # With GOOS=darwin the linter and vet load the files that build on macOS only (make lint-darwin runs the same two commands).
      - name: Lint the macOS files
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
        with:
          version: v2.15.0
          args: --timeout=5m
          # The action builds its cache key without GOOS, so this run would save under the key of the Linux run.
          skip-cache: true

      - name: Vet the macOS files
        run: make vet GOOS=darwin

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Cache ai-rulez
        id: ai-rulez-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/ai-rulez
          key: ai-rulez-${{ runner.os }}-${{ hashFiles('Makefile', 'scripts/install-ai-rulez.sh') }}

      - name: Install ai-rulez
        if: steps.ai-rulez-cache.outputs.cache-hit != 'true'
        run: make ai-rulez-install

      - name: Format, vet, dependencies, vulnerabilities
        run: make format-check vet deps vuln
        env:
          GOTELEMETRY: "off"

      - name: Agent rules
        run: make governance-verify

  # The race tests need more CPU time than one 4-core runner gives in the 30 minute limit of a job, so four jobs run them. The slice of a job
  # (make GO_TEST_SLICE) is its share of the go test runs. Each run starts when its job starts to test, and it ends at the go test timeout of
  # 18 minutes (GO_TEST_TIMEOUT) at the latest. The job limit of 35 minutes is that timeout plus 17 minutes for the setup and the build, so
  # a hung run is stopped by its own timeout, which prints the goroutines, and not by the job limit.
  test-shards:
    name: test-shards (${{ matrix.slice }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slice: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # The contract tests against a real bd need dolt and bd 1.3.2. With CI set, they fail when BEEHAVE_BD_132 is missing.
      # They run in slice 1, with the other packages.
      - name: Install dolt and bd
        if: startsWith(matrix.slice, '1/')
        run: |
          make contract-tools-install CONTRACT_TOOLS_DIR="$RUNNER_TEMP/contract-tools"
          echo "$RUNNER_TEMP/contract-tools" >> "$GITHUB_PATH"
          echo "BEEHAVE_BD_132=$RUNNER_TEMP/contract-tools/bd" >> "$GITHUB_ENV"

      - name: Race tests
        run: make test GO_TEST_SLICE=${{ matrix.slice }}
        env:
          GOTELEMETRY: "off"

      - name: Keep the coverage profiles and the JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: |
            coverage*.out
            reports/junit-*.xml
          if-no-files-found: error

  # The check that the pull request needs. It merges the profiles of the four jobs and runs the coverage gate and the smoke test.
  test:
    needs: test-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop when a test job failed
        run: test "${{ needs.test-shards.result }}" = success

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install go-test-coverage
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.20.1

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Coverage gate, smoke
        run: make coverage smoke
        env:
          GOTELEMETRY: "off"

      # make test runs without -v, so its log has no PASS line. This step prints the PASS line of each proof test by name.
      # A name with no test prints no PASS line, so a missing test never reads as a pass.
      - name: Proof tests
        if: always() && needs.test-shards.result == 'success'
        run: |
          status=0
          go test -run '^TestBeforeReview_ASecretScanFailsAPlantedKeyInTheCandidateDiffAndPassesACleanOne$' -count=1 -v ./internal/gate/ || status=1
          go test -run '^TestInstall_APartialThreadSyncStopsTheInstallation$' -count=1 -v ./internal/sandbox/landlock/ || status=1
          exit $status
        env:
          GOTELEMETRY: "off"

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache goreleaser
        id: goreleaser-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/goreleaser
          key: goreleaser-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install goreleaser
        if: steps.goreleaser-cache.outputs.cache-hit != 'true'
        run: make goreleaser-install

      - name: Build the release snapshot
        run: make release-snapshot
