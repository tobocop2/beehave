name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Install go-test-coverage
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.20.1

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Install ai-rulez
        run: go install github.com/Goldziher/ai-rulez/v5/cmd/ai-rulez@v5.4.1

      - name: Format, vet, vulnerabilities, race tests, coverage gate, smoke
        run: make format-check vet deps vuln test coverage smoke
        env:
          GOTELEMETRY: "off"

      - name: Agent rules
        run: make governance-verify

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
